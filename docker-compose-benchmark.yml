{
  "services": {
    "publisher": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "command": [
        "/usr/local/bin/publisher",
        "-config",
        "/app/publisher_config.json"
      ],
      "ports": [
        "8080:8080",
        "18080:18080"
      ],
      "volumes": [
        "./publisher_config_docker.json:/app/publisher_config.json"
      ],
      "networks": [
        "cda-net"
      ],
      "environment": [
        "PUBLISHER_QUEUE_TIMEOUT=300s",
        "PUBLISHER_MAX_IN_FLIGHT=2"
      ],
      "deploy": {
        "resources": {
          "limits": {
            "cpus": "8"
          }
        }
      }
    },
    "bootstrap-0": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "command": [
        "/usr/local/bin/bootstrap",
        "-port",
        "9200",
        "-col",
        "0",
        "-publisher",
        "http://publisher:8080",
        "-k",
        "64",
        "-k-piece",
        "8"
      ],
      "ports": [
        "9200:9200",
        "19200:19200"
      ],
      "networks": [
        "cda-net"
      ],
      "depends_on": [
        "publisher"
      ],
      "environment": [
        "BOOTSTRAP_PROOF_GEN_SEM=32",
        "BOOTSTRAP_ENCODE_WORKERS=8"
      ],
      "deploy": {
        "resources": {
          "limits": {
            "cpus": "8"
          }
        }
      }
    },
    "store-0-1": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile"
      },
      "command": [
        "/usr/local/bin/store",
        "-port",
        "8080",
        "-row",
        "0",
        "-col",
        "0",
        "-publisher",
        "http://publisher:8080",
        "-bootstrap",
        "/dns4/bootstrap-0/tcp/19200",
        "-k",
        "64",
        "-k-piece",
        "8",
        "-num-cols",
        "16",
        "-stores-per-col",
        "8",
        "-myaddr",
        "http://store-0-1:8080"
      ],
      "ports": [
        "9300:8080",
        "19300:18080"
      ],
      "volumes": [
        "./data/store_9300:/app/data/store_8080"
      ],
      "networks": [
        "cda-net"
      ],
      "depends_on": [
        "bootstrap-0"
      ],
      "environment": [
        "STORE_GOSSIP_BATCH_SIZE=64",
        "STORE_GOSSIP_BATCH_WORKERS=4"
      ],
      "deploy": {
        "resources": {
          "limits": {
            "cpus": "8"
          }
        }
      }
    },
